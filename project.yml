name: FinTrack
options:
  bundleIdPrefix: com.sany
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.9"
  TARGETED_DEVICE_FAMILY: "1,2"
  SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
  SUPPORTS_MACCATALYST: NO
  API_BASE_URL: "https://moneyback.esl.kz"
schemes:
  FinTrack:
    build:
      targets:
        FinTrack: all
        FinTrackWidget: all
    run:
      config: Debug
      environmentVariables:
        API_BASE_URL: "https://moneyback.esl.kz"
    archive:
      config: Release
targets:
  FinTrack:
    type: application
    platform: iOS
    sources:
      - path: FinTrack
        excludes:
          - "**/.DS_Store"
      - path: FinTrackShared
    resources:
      - path: FinTrack/Resources/Assets.xcassets
    settings:
      # Must match the install that already has SwiftData on device.
      # com.sany.fintrack is a second empty copy — do not ship to it.
      PRODUCT_BUNDLE_IDENTIFIER: com.sany.fintrack.W8NW533LT9
      PRODUCT_NAME: FinTrack
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: "monёy"
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: "1.0"
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: NO
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      CODE_SIGN_ENTITLEMENTS: FinTrack/FinTrack.entitlements
      SWIFT_STRICT_CONCURRENCY: targeted
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      TARGETED_DEVICE_FAMILY: "1,2"
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      SUPPORTS_MACCATALYST: NO
    entitlements:
      path: FinTrack/FinTrack.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.sany.fintrack.shared
    info:
      path: FinTrack/Info.plist
      properties:
        CFBundleDisplayName: "monёy"
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.sany.fintrack.W8NW533LT9
            CFBundleURLSchemes:
              - mony
        APIBaseURL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSFaceIDUsageDescription: "monёy использует Face ID, чтобы защитить доступ к финансам."
        NSPhotoLibraryUsageDescription: "monёy использует фото для вложений к транзакциям (чеки)."
    dependencies:
      - target: FinTrackWidget
        embed: true
  FinTrackWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: FinTrackWidget
      - path: FinTrackShared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.sany.fintrack.W8NW533LT9.widget
      PRODUCT_NAME: FinTrackWidget
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: "monёy"
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: "1.0"
      CODE_SIGN_ENTITLEMENTS: FinTrackWidget/FinTrackWidget.entitlements
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      SKIP_INSTALL: YES
      SWIFT_STRICT_CONCURRENCY: targeted
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      TARGETED_DEVICE_FAMILY: "1,2"
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      SUPPORTS_MACCATALYST: NO
    entitlements:
      path: FinTrackWidget/FinTrackWidget.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.sany.fintrack.shared
    info:
      path: FinTrackWidget/Info.plist
      properties:
        CFBundleDisplayName: "monёy"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

name: FinTrack
options:
  bundleIdPrefix: com.sany
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.9"
  TARGETED_DEVICE_FAMILY: "1,2"
  SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
  SUPPORTS_MACCATALYST: NO
  API_BASE_URL: "https://moneyback.esl.kz"
schemes:
  FinTrack:
    build:
      targets:
        FinTrack: all
    run:
      config: Debug
      environmentVariables:
        API_BASE_URL: "https://moneyback.esl.kz"
    archive:
      config: Release
targets:
  FinTrack:
    type: application
    platform: iOS
    sources:
      - path: FinTrack
        excludes:
          - "**/.DS_Store"
          - "Resources/Assets.xcassets"
          - "Resources/Assets.xcassets/**"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.sany.fintrack
      PRODUCT_NAME: FinTrack
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      SWIFT_STRICT_CONCURRENCY: targeted
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      TARGETED_DEVICE_FAMILY: "1,2"
      SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
      SUPPORTS_MACCATALYST: NO
    info:
      path: FinTrack/Info.plist
      properties:
        CFBundleDisplayName: "Monëy"
        APIBaseURL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSPhotoLibraryUsageDescription: "Monëy использует фото для вложений к транзакциям (чеки)."
